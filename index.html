<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير أرصدة الأصناف المجمع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3a5f;--navy2:#162b47;--gold:#c9a227;--gold2:#f3e3b5;--bg:#f4f6fa;--line:#dfe4ec;--ok:#1e8e4e;--bad:#c0392b;--warn:#d98e04}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:#1d2939}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
/* lock */
#lock{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy2),var(--navy));display:flex;align-items:center;justify-content:center;z-index:100}
.lockbox{background:#fff;border-radius:18px;padding:34px 30px;width:min(340px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:6px solid var(--gold)}
.lockbox h2{margin:0 0 6px;color:var(--navy)}
.lockbox p{margin:0 0 18px;color:#667085;font-size:14px}
.lockbox input{width:100%;font-size:28px;letter-spacing:12px;text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;outline:none;direction:ltr}
.lockbox input:focus{border-color:var(--gold)}
.lockbox button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:17px;font-weight:700}
#lockErr{color:var(--bad);height:22px;margin-top:8px;font-size:14px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
/* layout */
header{background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--gold);flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px}
header small{color:var(--gold2);font-weight:600}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px}
.btn.gold{background:var(--gold);color:var(--navy2)}
.btn.light{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.navy{background:var(--navy);color:#fff}
.btn.red{background:#fdecea;color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
main{max-width:1400px;margin:0 auto;padding:20px}
.panel{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(16,24,40,.06);padding:18px;margin-bottom:20px}
.panel h2{margin:0 0 12px;font-size:18px;color:var(--navy);display:flex;align-items:center;gap:8px}
.panel h2 .num{background:var(--gold);color:var(--navy2);width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
#drop{display:block;cursor:pointer;border:2.5px dashed #b8c2d3;border-radius:14px;padding:30px;text-align:center;background:#fafbfd;transition:.2s}
#drop.over{border-color:var(--gold);background:#fffaf0}
#drop .big{font-size:18px;font-weight:700;color:var(--navy)}
#drop .hint{color:#667085;font-size:14px;margin-top:6px}
#progress{margin-top:12px;font-weight:600;color:var(--navy)}
.bar{height:8px;background:#e9edf3;border-radius:6px;overflow:hidden;margin-top:6px;display:none}
.bar div{height:100%;width:0;background:var(--gold);transition:.2s}
/* cards */
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .top{display:flex;gap:10px;padding:12px;background:#f8f9fc;border-bottom:1px solid var(--line)}
.card .thumb{width:96px;height:64px;object-fit:cover;object-position:right top;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;flex-shrink:0}
.card .fields{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .fields input{width:100%;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px}
.card .fields input.ar{font-weight:700;font-size:14px}
.card .fields input.en{direction:ltr;text-align:right}
.status{padding:7px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.status.ok{background:#e8f6ee;color:var(--ok)}
.status.bad{background:#fdecea;color:var(--bad)}
.status.warn{background:#fff6e0;color:var(--warn)}
.card table{width:100%;border-collapse:collapse;font-size:13px}
.card th{background:var(--navy);color:#fff;padding:5px;font-weight:600}
.card td{border-bottom:1px solid #eef1f5;padding:3px 6px}
.card td.c{text-align:center;color:#475467;width:52px}
.card td input{width:90px;border:1px solid transparent;border-radius:6px;padding:3px 6px;text-align:center;direction:ltr;font-family:inherit;font-size:13px;background:transparent}
.card td input:hover,.card td input:focus{border-color:var(--line);background:#fff;outline:none}
.card tr.flag td{background:#fff3f2}
.card tr.tot td{background:var(--gold2);font-weight:800}
.card .foot{display:flex;justify-content:space-between;padding:8px 12px;margin-top:auto;border-top:1px solid var(--line)}
.empty{color:#98a2b3;text-align:center;padding:20px}
/* report */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-weight:700;color:var(--navy)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1;min-width:150px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:12px;padding:12px 16px;border-right:5px solid var(--gold)}
.kpi b{display:block;font-size:24px;color:var(--gold2)}
.kpi span{font-size:13px;opacity:.9}
.tblwrap{overflow:auto;border-radius:10px;border:1px solid var(--line);max-height:75vh}
table.rep{border-collapse:collapse;width:100%;font-size:14px;min-width:700px}
table.rep th{background:var(--navy);color:#fff;padding:8px 6px;position:sticky;top:0;z-index:2;font-weight:700;line-height:1.4}
table.rep th small{display:block;color:var(--gold2);font-weight:600;font-size:11px;direction:ltr}
table.rep td{padding:6px 8px;border-bottom:1px solid #eef1f5;text-align:center;white-space:nowrap}
table.rep td.name{text-align:right;font-weight:600}
table.rep tbody tr:nth-child(even) td{background:#f9fafc}
table.rep tbody tr:hover td{background:#fff8e6}
table.rep td.rt{background:#fffbea!important;font-weight:800;color:var(--navy)}
table.rep tfoot td{background:var(--gold2)!important;font-weight:800;color:var(--navy2);border-top:2px solid var(--navy);position:sticky;bottom:0}
table.rep td.z{color:#c0c7d2}
.mono{direction:ltr;display:inline-block}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px #000}
@media print{
  header .hbtns,#upPanel,#cardsPanel,.tabs,.noprint{display:none!important}
  body{background:#fff} main{padding:0;max-width:none} .panel{box-shadow:none;padding:0}
  .tblwrap{max-height:none;overflow:visible;border:0}
  table.rep{font-size:11px;min-width:0} table.rep th{position:static} table.rep tfoot td{position:static}
  .view{display:block!important;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="lock">
  <div class="lockbox" id="lockbox">
    <h2>🔒 تقرير الأرصدة المجمع</h2>
    <p>ادخل الرقم السري</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <button id="pinBtn">دخول</button>
    <div id="lockErr"></div>
  </div>
</div>

<header>
  <div><h1>تقرير أرصدة الأصناف المجمع بالمخازن</h1><small>شركة طيبة — استعلام عن رصيد صنف</small></div>
  <div class="hbtns">
    <button class="btn gold" id="xlsBtn">⬇ تحميل Excel</button>
    <button class="btn light" onclick="window.print()">🖨 طباعة / PDF</button>
    <button class="btn light" id="clearBtn">🗑 مسح الكل</button>
    <button class="btn light" id="logoutBtn">🔒 قفل</button>
  </div>
</header>

<main>
  <section class="panel" id="upPanel">
    <h2><span class="num">1</span> ارفع صور شاشة "استعلام عن رصيد صنف"</h2>
    <label id="drop">
      <input type="file" id="file" accept="image/*" multiple hidden>
      <div class="big">📷 اضغط هنا لاختيار الصور، أو اسحبها وافلتها هنا</div>
      <div class="hint">ممكن ترفع أكتر من صورة مرة واحدة • أو الصق صورة بـ Ctrl+V • الصورة لازم تكون سكرين شوت للشاشة كاملة بدون قص</div>
    </label>
    <div id="progress"></div>
    <div class="bar" id="bar"><div></div></div>
  </section>

  <section class="panel" id="cardsPanel">
    <h2><span class="num">2</span> راجع الأصناف المقروءة <span style="font-size:13px;color:#667085;font-weight:600">(تقدر تعدّل أي رقم أو اسم)</span></h2>
    <div id="cards"><div class="empty">لسه مفيش صور مرفوعة</div></div>
  </section>

  <section class="panel">
    <h2><span class="num">3</span> التقرير المجمع</h2>
    <div class="kpis" id="kpis"></div>
    <div class="tabs noprint">
      <button class="tab active" data-v="matrix">الأرصدة بالمخازن</button>
      <button class="tab" data-v="items">ملخص الأصناف</button>
    </div>
    <div class="view" id="v-matrix"></div>
    <div class="view" id="v-items" style="display:none"></div>
  </section>
</main>
<div id="modal"><img id="modalImg"></div>

<script>// Core table/digit reader for "استعلام عن رصيد صنف" screenshots. Works in browser and node.
(function (root) {
  const FW = 10, FH = 14;

  function toGray(rgba, W, H) {
    const g = new Uint8Array(W * H);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (rgba[j] * 299 + rgba[j + 1] * 587 + rgba[j + 2] * 114) / 1000;
    return g;
  }

  function group(a) {
    const g = [];
    for (const v of a) {
      if (g.length && v - g[g.length - 1][g[g.length - 1].length - 1] <= 2) g[g.length - 1].push(v);
      else g.push([v]);
    }
    return g.map(x => Math.round((x[0] + x[x.length - 1]) / 2));
  }

  function detectTable(gray, W, H) {
    const rc = new Int32Array(H), cc = new Int32Array(W);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (gray[y * W + x] < 170) { rc[y]++; cc[x]++; }
    let mr = 0; for (const v of rc) mr = Math.max(mr, v);
    const rows = group([...rc.keys()].filter(y => rc[y] > mr * 0.6 && rc[y] > W * 0.3));
    // columns: count dark only inside row span
    // keep the longest chain of evenly spaced row lines (the table body)
    let bestA = 0, bestB = 0;
    for (let i = 0; i < rows.length; i++) {
      let j = i;
      while (j + 1 < rows.length && rows[j + 1] - rows[j] >= 14 && rows[j + 1] - rows[j] <= 40 && (j === i || Math.abs((rows[j + 1] - rows[j]) - (rows[i + 1] - rows[i])) <= 4)) j++;
      if (j - i > bestB - bestA) { bestA = i; bestB = j; }
    }
    const rowsT = rows.slice(bestA, bestB + 1);
    rows.length = 0; rows.push(...rowsT);
    const top = rows[0] || 0, bot = rows[rows.length - 1] || H;
    const cc2 = new Int32Array(W);
    for (let y = top; y <= bot; y++) for (let x = 0; x < W; x++) if (gray[y * W + x] < 170) cc2[x]++;
    const span = bot - top + 1;
    const cols = group([...cc2.keys()].filter(x => cc2[x] > span * 0.6));
    // pattern of widths (left->right): total, notposted, posted, name, code  = 100,120,100,200,100
    const pat = [1, 1.2, 1, 2, 1];
    let best = null;
    for (let i = 0; i + 5 < cols.length; i++) {
      const d = []; for (let k = 0; k < 5; k++) d.push(cols[i + k + 1] - cols[i + k]);
      const u = d[3] / 2; if (u < 30) continue;
      let err = 0; for (let k = 0; k < 5; k++) err += Math.abs(d[k] / u - pat[k]);
      if (err < 0.35 && (!best || err < best.err)) best = { err, i };
    }
    if (!best) return null;
    const c = cols.slice(best.i, best.i + 6);
    // row pairs of normal height
    const hs = []; for (let i = 0; i + 1 < rows.length; i++) hs.push(rows[i + 1] - rows[i]);
    const sorted = hs.slice().sort((a, b) => a - b); const med = sorted[Math.floor(sorted.length / 2)] || 22;
    const rr = [];
    for (let i = 0; i + 1 < rows.length; i++) { const h = rows[i + 1] - rows[i]; if (Math.abs(h - med) <= Math.max(3, med * 0.2)) rr.push([rows[i], rows[i + 1]]); }
    return { cols: c, rows: rr, rowH: med };
  }

  // returns glyph list for a cell box [x0,y0,x1,y1]
  function glyphs(gray, W, H, box) {
    const [x0, y0, x1, y1] = box;
    const ix0 = x0 + 3, ix1 = x1 - 2, iy0 = y0 + 2, iy1 = y1 - 1;
    const ch = iy1 - iy0;
    const hist = new Int32Array(256); let cnt = 0;
    for (let y = iy0; y < iy1; y++) for (let x = ix0; x < ix1; x++) { hist[gray[y * W + x]]++; cnt++; }
    let acc = 0, bg = 255; for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= cnt / 2) { bg = v; break; } }
    const thr = bg - 35;
    const ink = (x, y) => gray[y * W + x] < thr;
    const colInk = [];
    for (let x = ix0; x < ix1; x++) { let n = 0; for (let y = iy0; y < iy1; y++) if (ink(x, y)) n++; colInk.push(n); }
    const runs = []; let s = -1;
    for (let i = 0; i <= colInk.length; i++) {
      const on = i < colInk.length && colInk[i] > 0;
      if (on && s < 0) s = i; if (!on && s >= 0) { runs.push([s, i]); s = -1; }
    }
    // soft projection for splitting touching digits
    const proj = [];
    for (let x = ix0; x < ix1; x++) { let p = 0; for (let y = iy0; y < iy1; y++) p += Math.max(0, bg - gray[y * W + x]); proj.push(p); }
    const maxW = Math.max(5, ch * 0.4);
    const pieces = [];
    const split = (a, b) => {
      if (b - a <= maxW) { pieces.push([a, b]); return; }
      let bx = -1, bp = 1e18;
      for (let x = a + 2; x <= b - 3; x++) if (proj[x] < bp) { bp = proj[x]; bx = x; }
      if (bx < 0) { pieces.push([a, b]); return; }
      split(a, bx); split(bx + 1, b);
    };
    for (const [a, b] of runs) split(a, b);
    const vb = (a, b) => { let t = iy1, u = iy0; for (let y = iy0; y < iy1; y++) for (let x = ix0 + a; x < ix0 + b; x++) if (ink(x, y)) { if (y < t) t = y; if (y >= u) u = y + 1; } return [t, u]; };
    const P = pieces.map(([a, b]) => { const [t, u] = vb(a, b); return { a, b, t, u }; });
    // merge a small top hook (as in ٦) into the tall glyph right after it
    for (let i = 0; i + 1 < P.length; i++) {
      const p = P[i], q = P[i + 1];
      const qh = q.u - q.t, ph = p.u - p.t;
      if (q.a - p.b <= 1 && ph * 2.5 <= qh && Math.abs(p.t - q.t) <= 1 && p.u <= q.t + qh / 2 && q.b - p.a <= maxW + 1) {
        P.splice(i, 2, { a: p.a, b: q.b, t: Math.min(p.t, q.t), u: Math.max(p.u, q.u) }); i--;
      }
    }
    const out = [];
    for (const { a, b, t, u } of P) {
      const gx0 = ix0 + a, gx1 = ix0 + b;
      const gy0 = t, gy1 = u;
      const w = gx1 - gx0, h = gy1 - gy0;
      if (w * h < 2) continue;
      // feature: area-sampled darkness on FW x FH grid
      const f = new Array(FW * FH + 3).fill(0);
      for (let fy = 0; fy < FH; fy++) for (let fx = 0; fx < FW; fx++) {
        const sx0 = gx0 + fx * w / FW, sx1 = gx0 + (fx + 1) * w / FW, sy0 = gy0 + fy * h / FH, sy1 = gy0 + (fy + 1) * h / FH;
        let sum = 0, n = 0;
        for (let y = Math.floor(sy0); y < Math.ceil(sy1); y++) for (let x = Math.floor(sx0); x < Math.ceil(sx1); x++) { sum += Math.max(0, Math.min(1, (bg - gray[y * W + x]) / Math.max(60, bg - 40))); n++; }
        f[fy * FW + fx] = n ? sum / n : 0;
      }
      f[FW * FH] = 4 * h / ch; f[FW * FH + 1] = 4 * w / ch; f[FW * FH + 2] = 4 * ((gy0 + gy1) / 2 - iy0) / ch;
      out.push({ f, x: gx0, w, h });
    }
    return out;
  }

  function dist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return s; }

  function classify(f, T) {
    let best = null, bd = 1e9, second = 1e9;
    for (const t of T) { const d = dist(f, t.f); if (d < bd) { if (best !== t.c) second = bd; bd = d; best = t.c; } else if (t.c !== best && d < second) second = d; }
    return { c: best, d: bd, margin: second - bd };
  }

  function readCell(gray, W, H, box, T) {
    const gs = glyphs(gray, W, H, box);
    let s = '', conf = 1e9;
    for (const g of gs) { const r = classify(g.f, T); s += r.c; conf = Math.min(conf, r.margin); }
    return { text: s, conf, n: gs.length };
  }

  function parseNum(s) {
    if (!s) return null;
    if (!/^\d+(,\d+)?$/.test(s)) return NaN;
    return parseFloat(s.replace(',', '.'));
  }

  // read whole screenshot
  function readReport(gray, W, H, T) {
    const t = detectTable(gray, W, H);
    if (!t) return { error: 'table-not-found' };
    const c = t.cols, rows = [];
    let total = null;
    for (const [y0, y1] of t.rows) {
      const tot = readCell(gray, W, H, [c[0], y0, c[1], y1], T);
      const unp = readCell(gray, W, H, [c[1], y0, c[2], y1], T);
      const code = readCell(gray, W, H, [c[4], y0, c[5], y1], T);
      const nameInk = glyphs(gray, W, H, [c[3], y0, c[4], y1], T).length;
      const vTot = parseNum(tot.text), vUnp = parseNum(unp.text), vCode = parseNum(code.text);
      const row = { y0, y1, code: vCode, total: vTot, unposted: vUnp, rawTotal: tot.text, rawCode: code.text, conf: Math.min(tot.conf, code.n ? code.conf : 1e9) };
      if (code.n === 0 && nameInk > 0 && vTot != null && !isNaN(vTot)) { total = vTot; continue; }
      if (vCode == null || isNaN(vCode) || !Number.isInteger(vCode)) continue; // header or junk
      rows.push(row);
    }
    return { rows, total, table: t };
  }

  const api = { toGray, detectTable, glyphs, classify, readCell, readReport, parseNum, FW, FH };
  if (typeof module !== 'undefined') module.exports = api; else root.ReportOCR = api;
})(this);

// ---------- PIN ----------
function h32(s){let h=0x811c9dc5;for(const ch of s+'|taiba'){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16)}
function unlock(){document.getElementById('lock').style.display='none';sessionStorage.setItem('taiba_ok','1')}
function tryPin(){const v=document.getElementById('pin').value.trim();
  if(h32(v)===PIN_HASH){unlock();}else{const b=document.getElementById('lockbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  document.getElementById('lockErr').textContent='الرقم السري غلط';document.getElementById('pin').value='';}}
document.getElementById('pinBtn').onclick=tryPin;
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()});
if(sessionStorage.getItem('taiba_ok')==='1')unlock(); else setTimeout(()=>document.getElementById('pin').focus(),100);
document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('taiba_ok');location.reload()};

// ---------- templates ----------
const N = ReportOCR.FW*ReportOCR.FH;
const TPL = Object.entries(PACKED).flatMap(([c,a])=>a.map(s=>{const f=[];for(let i=0;i<N;i++)f.push(+s[i]/9);for(let i=N;i<s.length;i++)f.push((s.charCodeAt(i)-48)/10);return {c,f}}));

// ---------- state ----------
let state = load(LS.state, {items:[]});
const NAMES_DEFAULT = {
 'BLACK PERFUME INTENSE':{ar:'اكوا دى جيو اليكسير / جورجيو ارمانى',en:'BLACK PERFUME INTENSE',code:'350059-4'},
 'BURNING KISS':{ar:'شيرى سموك / توم فورد',en:'burning kiss',code:'a-462395'},
 'THE LANGUAGE OF PASSION':{ar:'لوف دونت بى شاى اكستريم',en:'THE LANGUAGE OF PASSION',code:'230364-4'},
 'SILVER TIGHTS':{ar:'سكاندل اليكسير حريمى',en:'SILVER TIGHTS',code:'120422-3'},
 'GREAT VICTORY':{ar:'سكاندال اليكسير رجالى',en:'GREAT VICTORY',code:'680427-3'},
 'PRIVATE GALLANT MAN':{ar:'جنتلمان اودى برفيوم ريسيرف بريفية',en:'private gallant man',code:'a-233161'}};
let nameMem = Object.assign({}, NAMES_DEFAULT, load(LS.names, {}));
let whNames = Object.assign({}, WH_DEFAULT, load(LS.wh, {}));
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(){try{localStorage.setItem(LS.state,JSON.stringify(state));localStorage.setItem(LS.names,JSON.stringify(nameMem));localStorage.setItem(LS.wh,JSON.stringify(whNames))}catch(e){console.warn(e)}}
const r3 = v => Math.round(v*1000)/1000;
const fmt = v => v==null||v===''?'':Number(v).toLocaleString('en-US',{maximumFractionDigits:3});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normEn = s => String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

// ---------- image reading ----------
function fileToImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u;})}
function canvasFrom(img,scale){const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);return c}
function analyze(img){
  let scale=1, cv, res, gray, W, H;
  for(let pass=0;pass<2;pass++){
    cv=canvasFrom(img,scale);W=cv.width;H=cv.height;
    gray=ReportOCR.toGray(cv.getContext('2d').getImageData(0,0,W,H).data,W,H);
    res=ReportOCR.readReport(gray,W,H,TPL);
    if(res.error||!res.table)break;
    const rh=res.table.rowH; if(rh>=20&&rh<=24)break; scale=scale*22/rh;
  }
  return {res,cv};
}
function cropUp(cv,box,k=3){const [x0,y0,x1,y1]=box.map(Math.round);const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0);const c=document.createElement('canvas');c.width=w*k;c.height=h*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(cv,x0,y0,w,h,0,0,w*k,h*k);return c}
function thumbOf(img){const w=Math.min(700,img.naturalWidth),s=w/img.naturalWidth;const c=canvasFrom(img,s);return c.toDataURL('image/jpeg',0.7)}

let workers={};
async function getWorker(lang){
  if(!window.Tesseract)throw new Error('no tesseract');
  if(!workers[lang]){workers[lang]=(async()=>{const w=await Tesseract.createWorker(lang);await w.setParameters({tessedit_pageseg_mode:'7'});return w})();}
  return workers[lang];
}
async function readNames(cv,table){
  const c=table.cols, top=table.rows[0][0], out={ar:'',en:''};
  try{const w=await getWorker('eng');const {data}=await w.recognize(cropUp(cv,[c[2]-35,top-70,c[4]+20,top-42]));
    out.en=(data.text||'').replace(/[^A-Za-z0-9 '&.\-]/g,' ').replace(/\s+/g,' ').trim();}catch(e){console.warn(e)}
  try{const w=await getWorker('ara');const {data}=await w.recognize(cropUp(cv,[c[2]-35,top-97,c[4]+20,top-71]));
    out.ar=(data.text||'').replace(/[^ء-ي\s\/]/g,' ').replace(/\s+/g,' ').replace(/^[\s\/]+|[\s\/]+$/g,'').trim();}catch(e){console.warn(e)}
  return out;
}
function loadTesseract(){return new Promise(res=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=res;document.head.appendChild(s)})}

async function handleFiles(files){
  files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const prog=document.getElementById('progress'),bar=document.getElementById('bar');bar.style.display='block';
  const tl=loadTesseract();
  for(let i=0;i<files.length;i++){
    prog.textContent=`جارى قراءة الصورة ${i+1} من ${files.length} ...`;bar.firstElementChild.style.width=(i/files.length*100)+'%';
    await new Promise(r=>setTimeout(r,30));
    let item={id:Date.now()+'_'+i,ar:'',en:'',code:'',rows:[],readTotal:null,thumb:'',error:''};
    try{
      const img=await fileToImg(files[i]);item.thumb=thumbOf(img);
      const {res,cv}=analyze(img);
      if(res.error){item.error='مش لاقي جدول الأرصدة فى الصورة دى — اتأكد إنها سكرين شوت لشاشة "استعلام عن رصيد صنف" كاملة، أو دخّل الأرقام يدوى.';}
      else{
        item.rows=res.rows.map(r=>({code:r.code,val:r.total,unp:r.unposted}));
        item.readTotal=res.total;
        prog.textContent=`جارى قراءة اسم الصنف ${i+1} من ${files.length} ...`;
        await tl; const nm=await readNames(cv,res.table);
        item.en=nm.en; item.ar=nm.ar;
        const mem=nameMem[normEn(nm.en)]; if(mem){item.ar=mem.ar||item.ar;item.code=mem.code||'';item.en=mem.en||item.en;}
      }
    }catch(e){console.error(e);item.error='حصلت مشكلة فى قراءة الصورة.';}
    const dup=item.en?state.items.findIndex(x=>normEn(x.en)===normEn(item.en)):-1;
    if(dup>=0){state.items[dup]=item;item.note='اتحدّث (الصنف ده كان مرفوع قبل كده)';}else state.items.push(item);
    save();render();
  }
  bar.firstElementChild.style.width='100%';prog.textContent=`✔ خلصت قراءة ${files.length} صورة`;setTimeout(()=>{bar.style.display='none'},800);
}

// ---------- checks ----------
function check(it){
  if(it.error&&!it.rows.length)return {cls:'bad',txt:'⚠ '+it.error};
  const sum=r3(it.rows.reduce((a,r)=>a+(+r.val||0),0));
  const badRows=it.rows.filter(r=>r.unp!=null&&r.val!=null&&r3(r.unp)!==r3(r.val)&&!r.edited).length;
  if(it.readTotal==null)return {cls:'warn',txt:`⚠ مقريتش إجمالى كل المخازن من الصورة — راجع الأرقام (المجموع ${fmt(sum)})`};
  if(Math.abs(sum-it.readTotal)<0.0006&&!badRows)return {cls:'ok',txt:`✔ مطابق لإجمالى الشاشة ${fmt(it.readTotal)}`};
  return {cls:'bad',txt:`⚠ المجموع ${fmt(sum)} ≠ إجمالى الشاشة ${fmt(it.readTotal)} — راجع الصفوف المعلّمة بالأحمر`};
}

// ---------- render ----------
function render(){renderCards();renderReport();}
function renderCards(){
  const box=document.getElementById('cards');
  if(!state.items.length){box.innerHTML='<div class="empty">لسه مفيش صور مرفوعة</div>';return}
  box.innerHTML=state.items.map((it,ix)=>{
    const ck=check(it);
    const rows=it.rows.slice().sort((a,b)=>a.code-b.code).map(r=>{
      const flag=r.unp!=null&&r.val!=null&&r3(r.unp)!==r3(r.val)&&!r.edited;
      return `<tr class="${flag?'flag':''}"><td class="c">${r.code}</td><td>${esc(whNames[r.code]||('مخزن '+r.code))}</td><td style="text-align:center"><input type="number" step="any" value="${r.val??''}" data-ix="${ix}" data-code="${r.code}" class="val"></td></tr>`}).join('');
    const sum=it.rows.reduce((a,r)=>a+(+r.val||0),0);
    return `<div class="card">
      <div class="top"><img class="thumb" src="${it.thumb}" data-ix="${ix}" title="عرض الصورة">
        <div class="fields">
          <input class="ar" placeholder="اسم الصنف بالعربى" value="${esc(it.ar)}" data-ix="${ix}" data-f="ar">
          <input class="en" placeholder="English name" value="${esc(it.en)}" data-ix="${ix}" data-f="en">
          <input placeholder="كود الصنف (اختيارى)" value="${esc(it.code)}" data-ix="${ix}" data-f="code" style="direction:ltr;text-align:right">
        </div></div>
      <div class="status ${ck.cls}"><span>${ck.txt}</span></div>
      ${it.note?`<div class="status warn" style="font-weight:600">${it.note}</div>`:''}
      <table><thead><tr><th>الكود</th><th>المخزن</th><th>الرصيد</th></tr></thead><tbody>${rows}
      <tr class="tot"><td></td><td>الإجمالى</td><td style="text-align:center">${fmt(sum)}</td></tr></tbody></table>
      <div class="foot"><button class="btn small navy" data-add="${ix}">+ مخزن</button><button class="btn small red" data-del="${ix}">حذف الصنف</button></div>
    </div>`}).join('');
}
function itemLabel(it,i){return it.ar||it.en||('صنف '+(i+1))}
function renderReport(){
  const items=state.items.filter(it=>it.rows.length);
  const codes=[...new Set(items.flatMap(it=>it.rows.map(r=>r.code)))].sort((a,b)=>a-b);
  const grand=items.reduce((a,it)=>a+it.rows.reduce((b,r)=>b+(+r.val||0),0),0);
  const okN=items.filter(it=>check(it).cls==='ok').length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><span>عدد الأصناف</span><b>${items.length}</b></div>
    <div class="kpi"><span>عدد المخازن</span><b>${codes.length}</b></div>
    <div class="kpi"><span>إجمالى الأرصدة (كيلو)</span><b>${fmt(r3(grand))}</b></div>
    <div class="kpi"><span>أصناف مطابقة للشاشة</span><b>${okN} / ${items.length}</b></div>`;
  if(!items.length){document.getElementById('v-matrix').innerHTML=document.getElementById('v-items').innerHTML='<div class="empty">التقرير هيظهر هنا بعد رفع الصور</div>';return}
  const val=(it,c)=>{const r=it.rows.find(r=>r.code===c);return r&&r.val!=null&&r.val!==''?+r.val:null};
  let h='<div class="tblwrap"><table class="rep"><thead><tr><th>كود المخزن</th><th>اسم المخزن</th>';
  items.forEach((it,i)=>h+=`<th>${esc(itemLabel(it,i))}${it.en&&it.ar?`<small>${esc(it.en)}</small>`:''}${it.code?`<small>${esc(it.code)}</small>`:''}</th>`);
  h+='<th>إجمالى المخزن</th></tr></thead><tbody>';
  codes.forEach(c=>{let t=0;h+=`<tr><td>${c}</td><td class="name">${esc(whNames[c]||('مخزن '+c))}</td>`;
    items.forEach(it=>{const v=val(it,c);if(v!=null)t+=v;h+=`<td class="${v==null?'z':''}"><span class="mono">${v==null?'—':fmt(v)}</span></td>`});
    h+=`<td class="rt"><span class="mono">${fmt(r3(t))}</span></td></tr>`});
  h+='</tbody><tfoot><tr><td></td><td class="name">إجمالى كل المخازن</td>';
  items.forEach(it=>h+=`<td><span class="mono">${fmt(r3(it.rows.reduce((a,r)=>a+(+r.val||0),0)))}</span></td>`);
  h+=`<td><span class="mono">${fmt(r3(grand))}</span></td></tr></tfoot></table></div>`;
  document.getElementById('v-matrix').innerHTML=h;
  let s='<div class="tblwrap"><table class="rep"><thead><tr><th>م</th><th>كود الصنف</th><th>اسم الصنف</th><th>الاسم الإنجليزى</th><th>إجمالى الرصيد (كيلو)</th><th>عدد المخازن</th><th>أكبر مخزن</th><th>المراجعة</th></tr></thead><tbody>';
  items.forEach((it,i)=>{const sum=r3(it.rows.reduce((a,r)=>a+(+r.val||0),0));const top=it.rows.slice().sort((a,b)=>b.val-a.val)[0];const ck=check(it);
    s+=`<tr><td>${i+1}</td><td><span class="mono">${esc(it.code)}</span></td><td class="name">${esc(it.ar)}</td><td><span class="mono">${esc(it.en)}</span></td><td><b class="mono">${fmt(sum)}</b></td><td>${it.rows.filter(r=>+r.val).length}</td><td class="name">${top?esc(whNames[top.code]||top.code)+` <span class="mono">(${fmt(top.val)})</span>`:''}</td><td style="color:${ck.cls==='ok'?'var(--ok)':'var(--bad)'};font-weight:700">${ck.cls==='ok'?'✔ مطابق':'⚠ راجع'}</td></tr>`});
  s+=`</tbody><tfoot><tr><td></td><td></td><td class="name">الإجمالى</td><td></td><td><span class="mono">${fmt(r3(grand))}</span></td><td></td><td></td><td></td></tr></tfoot></table></div>`;
  document.getElementById('v-items').innerHTML=s;
}

// ---------- events ----------
const drop=document.getElementById('drop');
document.getElementById('file').addEventListener('change',e=>{handleFiles(e.target.files);e.target.value=''});
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/')).map(i=>i.getAsFile());if(fs.length)handleFiles(fs)});
document.getElementById('cards').addEventListener('change',e=>{
  const t=e.target,ix=+t.dataset.ix,it=state.items[ix];if(!it)return;
  if(t.classList.contains('val')){const r=it.rows.find(r=>r.code===+t.dataset.code);r.val=t.value===''?null:+t.value;r.edited=true;}
  else if(t.dataset.f){it[t.dataset.f]=t.value.trim();if(it.en)nameMem[normEn(it.en)]={ar:it.ar,en:it.en,code:it.code};}
  save();render();
});
document.getElementById('cards').addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.del!=null){if(confirm('تحذف الصنف ده من التقرير؟')){state.items.splice(+t.dataset.del,1);save();render()}}
  else if(t.dataset.add!=null){const it=state.items[+t.dataset.add];const c=+prompt('كود المخزن (مثلاً 101):');if(!c)return;
    if(!whNames[c]){const n=prompt('اسم المخزن:');if(n)whNames[c]=n.trim();}
    if(it.rows.some(r=>r.code===c))return alert('المخزن ده موجود بالفعل فى الصنف');
    const v=prompt('الرصيد:');it.rows.push({code:c,val:v===null||v===''?null:+v,unp:null,edited:true});save();render();}
  else if(t.classList.contains('thumb')){document.getElementById('modalImg').src=state.items[+t.dataset.ix].thumb;document.getElementById('modal').style.display='flex'}
});
document.getElementById('modal').onclick=()=>document.getElementById('modal').style.display='none';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.style.display=v.id==='v-'+b.dataset.v?'block':'none')});
document.getElementById('clearBtn').onclick=()=>{if(state.items.length&&confirm('تمسح كل الأصناف المرفوعة وتبدأ تقرير جديد؟')){state.items=[];save();render();document.getElementById('progress').textContent=''}};

// ---------- excel ----------
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
document.getElementById('xlsBtn').onclick=async()=>{
  const items=state.items.filter(it=>it.rows.length);if(!items.length)return alert('ارفع صور الأول');
  try{await loadXLSX()}catch(e){return alert('مقدرتش أحمّل مكتبة Excel — اتأكد من الإنترنت')}
  const codes=[...new Set(items.flatMap(it=>it.rows.map(r=>r.code)))].sort((a,b)=>a-b);
  const head=['كود المخزن','اسم المخزن',...items.map((it,i)=>itemLabel(it,i)+(it.en&&it.ar?' - '+it.en:'')),'إجمالى المخزن'];
  const aoa=[head];
  codes.forEach(c=>{const row=[c,whNames[c]||('مخزن '+c)];let t=0;items.forEach(it=>{const r=it.rows.find(r=>r.code===c);const v=r&&r.val!=null?+r.val:null;if(v!=null)t+=v;row.push(v)});row.push(r3(t));aoa.push(row)});
  const tr=['','إجمالى كل المخازن'];let g=0;items.forEach(it=>{const s=r3(it.rows.reduce((a,r)=>a+(+r.val||0),0));g+=s;tr.push(s)});tr.push(r3(g));aoa.push(tr);
  const ws1=XLSX.utils.aoa_to_sheet(aoa);ws1['!cols']=[{wch:11},{wch:26},...items.map(()=>({wch:24})),{wch:14}];
  const aoa2=[['م','كود الصنف','اسم الصنف','الاسم الإنجليزى','الوحدة','إجمالى الرصيد','عدد المخازن']];
  items.forEach((it,i)=>aoa2.push([i+1,it.code,it.ar,it.en,'كيلو',r3(it.rows.reduce((a,r)=>a+(+r.val||0),0)),it.rows.filter(r=>+r.val).length]));
  aoa2.push(['','','الإجمالى','','',r3(g),'']);
  const ws2=XLSX.utils.aoa_to_sheet(aoa2);ws2['!cols']=[{wch:5},{wch:14},{wch:34},{wch:28},{wch:8},{wch:14},{wch:12}];
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws1,'الأرصدة بالمخازن');XLSX.utils.book_append_sheet(wb,ws2,'ملخص الأصناف');
  const d=new Date();XLSX.writeFile(wb,`تقرير_الأرصدة_المجمع_${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}.xlsx`);
};
render();
</script>
</body>
</html>
